    <path d="M121 72 102 61 84 75 102 86Z" fill="#0b080d" stroke="url(#silver)" stroke-width="2"/>
    <path d="M43 72 59 66 69 75 57 79Z" fill="url(#rose)" stroke="url(#copper)" stroke-width="1.2"/>
    <path d="M117 72 101 66 91 75 103 79Z" fill="url(#rose)" stroke="url(#copper)" stroke-width="1.2"/>
    <circle cx="59" cy="73" r="2" fill="#fdfdfd"/><circle cx="101" cy="73" r="2" fill="#fdfdfd"/>
    <path d="M34 91 Q54 85 69 94 L80 111 91 94 Q106 85 126 91 L111 112 80 143 49 112Z" fill="url(#silver)" fill-opacity=".13" stroke="url(#rose)" stroke-width="1.8" stroke-linejoin="round"/>
