    <path d="M29 80 Q31 53 58 56 Q73 58 80 76 Q87 58 102 56 Q129 53 131 80 Q131 103 108 116 L80 128 52 116 Q29 103 29 80Z" fill="url(#silver)" fill-opacity=".11" stroke="url(#rose)" stroke-width="2"/>
    <path d="M35 79 Q49 58 68 77 Q56 99 35 79Z" fill="#0b080d" stroke="url(#silver)" stroke-width="2.5"/>
    <path d="M125 79 Q111 58 92 77 Q104 99 125 79Z" fill="#0b080d" stroke="url(#silver)" stroke-width="2.5"/>
    <circle cx="53" cy="78" r="8" fill="url(#rose)" stroke="url(#copper)" stroke-width="1.7"/>
    <circle cx="107" cy="78" r="8" fill="url(#rose)" stroke="url(#copper)" stroke-width="1.7"/>
    <circle cx="55" cy="76" r="2.3" fill="#fdfdfd"/><circle cx="109" cy="76" r="2.3" fill="#fdfdfd"/>
    <path d="M80 82 69 96 80 106 91 96Z" fill="url(#copper)" stroke="url(#silver)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M44 103 Q56 117 72 119 M116 103 Q104 117 88 119" fill="none" stroke="url(#silver)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M55 111 65 130 M72 118 80 137 88 118 M105 111 95 130" fill="none" stroke="url(#copper)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M41 62 50 55 M119 62 110 55 M62 48 80 40 98 48" fill="none" stroke="url(#silver)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <path d="M32 113 43 126 58 132 M128 113 117 126 102 132" fill="none" stroke="url(#rose)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 13 75 24 80 21 85 24Z" fill="url(#copper)"/>
</svg>