    <path d="M51 104 63 115 M109 104 97 115 M63 122 72 130 M97 122 88 130" fill="none" stroke="url(#copper)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M58 46 67 53 M102 46 93 53 M73 46 80 42 87 46" fill="none" stroke="url(#silver)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <path d="M29 79 39 88 M131 79 121 88 M48 115 43 124 M112 115 117 124" fill="none" stroke="url(#rose)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 14 75 24 80 21 85 24Z" fill="url(#copper)"/>
