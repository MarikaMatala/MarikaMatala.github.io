<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Silver and rose-gold gothic fox head</title>
  <desc id="desc">A standalone stylized fox head with tall pointed ears, sharp eyes and engraved silver lines with rose-gold and copper accents. No frame or window.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".32" stop-color="#bfc2c8"/><stop offset=".62" stop-color="#747986"/><stop offset="1" stop-color="#e7e8eb"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0c5cf"/><stop offset=".45" stop-color="#b98591"/><stop offset="1" stop-color="#6f3546"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2c49a"/><stop offset=".45" stop-color="#ce8147"/><stop offset="1" stop-color="#7e3e29"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
