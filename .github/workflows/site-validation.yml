name: Site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check local references, duplicate IDs and HTML anchors
        run: python scripts/validate_site.py

      - name: Set up Node.js for Remote Job Fit vocabulary tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run experimental Remote Job Fit vocabulary tests
        continue-on-error: true
        run: node --test tests/remote-job-fit-vocabulary.test.cjs
