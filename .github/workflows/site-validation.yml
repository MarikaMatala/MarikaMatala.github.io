# KOMMENTOINTIOHJE / CODE MAP
# Tiedoston tarkoitus: GitHub Actions -työnkulku, joka ajaa portfoliosivuston rakenteen, saavutettavuuden ja muiden automaattisten tarkistusten testit.
# Rakenne: on = käynnistystapahtumat; jobs = suoritettavat työt; steps = yksittäiset vaiheet.
# Tarkista aina sisennys, kun lisäät tai muutat vaiheita.

name: Site validation

on:
# TYÖVAIHEEN MÄÄRITYS: tämän nimen alla ovat kyseisen työn suoritettavat vaiheet.
  pull_request:
    branches: [main]
# TYÖVAIHEEN MÄÄRITYS: tämän nimen alla ovat kyseisen työn suoritettavat vaiheet.
  push:
    branches: [main]

permissions:
# TYÖVAIHEEN MÄÄRITYS: tämän nimen alla ovat kyseisen työn suoritettavat vaiheet.
  contents: read

jobs:
# TYÖVAIHEEN MÄÄRITYS: tämän nimen alla ovat kyseisen työn suoritettavat vaiheet.
  validate:
    name: Validate HTML, accessibility baseline and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check local references, semantics and accessibility baseline
        run: python scripts/validate_site.py

      - name: Test accessibility validator
        run: python -m unittest discover -s tests -p "test_site_accessibility.py"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check contact-filter.js
          node --check gothic-enhancements.js
          node --check The-Cultured-Vault-demo.js
          node --check The-Cultured-Vault-demo/app.js
          node --check The-Cultured-Vault-demo/sw.js
          node --check remote-job-fit-demo.js
          node --check remote-job-fit-vocabulary.js

      - name: Test Remote Job Fit vocabulary
        run: node --test tests/remote-job-fit-vocabulary.test.cjs

      - name: Test The Cultured Vault demo data integrity
        run: node --test tests/cultured-vault-demo-data.test.cjs
